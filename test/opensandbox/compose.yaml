# A real OpenSandbox server for the opensandbox adapter's live test:
#   DOCKER_CONTEXT=<docker host> docker compose -f test/opensandbox/compose.yaml up -d
#   OPENSANDBOX_URL=http://localhost:8090/v1 go test -tags live ./internal/adapters/opensandbox/
name: differently-opensandbox

services:
  opensandbox-server:
    image: opensandbox/server:release-1.2.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config.toml:/etc/opensandbox/config.toml:ro
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
