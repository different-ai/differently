name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include the error code and requestId if you have them. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
  - type: input
    id: version
    attributes: { label: Version (differently-server version) }
  - type: dropdown
    id: env
    attributes:
      label: Where it runs
      options: [dev mode, Kubernetes (bare metal), EKS, GKE, AKS, systemd agent, other]
  - type: markdown
    attributes: { value: "Security issue? Please report it privately instead: see SECURITY.md." }
