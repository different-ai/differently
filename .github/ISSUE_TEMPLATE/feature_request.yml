name: Feature request
description: Propose a capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What are you trying to do, and what stops you today? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
  - type: textarea
    id: parity
    attributes: { label: Prior art, description: How do other sandbox platforms handle this? See docs/feature-parity.md. }
