name: release

# vX.Y.Z-rc.N tags on pre-release publish GitHub pre-releases; vX.Y.Z tags on
# main publish releases. Artifacts are reproducible-flagged Go builds with
# checksums, SPDX SBOMs, keyless cosign signatures and multi-arch images with
# provenance attestations.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for os in linux darwin; do for arch in amd64 arm64; do
            out="dist/differently_${VERSION}_${os}_${arch}"; mkdir -p "$out"
            bins="./cmd/differently-server ./cmd/differently"
            [ "$os" = linux ] && bins="$bins ./cmd/differently-agent ./cmd/differently-guest"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/different-ai/differently/internal/version.Version=${VERSION} -X github.com/different-ai/differently/internal/version.Commit=${GITHUB_SHA::7}" \
              -o "$out/" $bins
            cp LICENSE NOTICE README.md "$out/"
            tar -C dist -czf "$out.tar.gz" "$(basename "$out")"
          done; done
          cd dist && sha256sum *.tar.gz > checksums.txt
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/differently.spdx.json
      - uses: sigstore/cosign-installer@v3
      - name: sign checksums (keyless)
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: chart
        uses: azure/setup-helm@v4
      - name: package chart
        run: helm package deploy/helm/differently --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}" -d dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tgz
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
            dist/differently.spdx.json

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [server, agent, cli]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/differently-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: sign image (keyless)
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/differently-${{ matrix.image }}@${{ steps.build.outputs.digest }}"
