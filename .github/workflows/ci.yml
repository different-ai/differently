name: ci

on:
  pull_request:
    branches: [pre-release, main]
  push:
    branches: [pre-release, main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: vet (including the e2e and live test files, which are not run here)
        run: make vet
      - name: test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: cross-build linux amd64/arm64
        run: make build-linux

  # The adapter kinds left out of the default build (experimental_adapters
  # tag) must keep compiling and passing their fake-server tests.
  go-experimental:
    name: go (experimental adapters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build, vet and test with -tags experimental_adapters
        run: make experimental

  # The store conformance suite and the server acceptance scenarios, both
  # against a real Postgres. A missing database fails the run, never skips it.
  postgres:
    name: postgres conformance and acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-postgres
        env:
          DIFFERENTLY_TEST_POSTGRES_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable

  sdk-typescript:
    name: sdk (typescript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  console:
    name: console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: static build
        run: npm run build
      - name: server build
        run: npm run build:server

  sdk-python:
    name: sdk (python ${{ matrix.python }})
    # ubuntu-latest moved to Ubuntu 26.04, which has no Python 3.9 build for
    # setup-python. The SDK still declares requires-python >= 3.9, so keep
    # testing it on the last image that provides it.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests

  # The real stack, nothing faked: Postgres, differently-server and an
  # OpenSandbox server on the Docker runtime, driven through the public API
  # (test/e2e). Sandboxes are containers here, so this proves orchestration,
  # not microVM isolation; tests for what this runtime lacks skip themselves.
  # The approve job waits for it: it passed twice in a row before it was added.
  e2e:
    name: end-to-end (docker runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build the server image and pull the sandbox images
        run: make e2e-prepare
      - name: start Postgres, OpenSandbox and the server
        run: make e2e-up
      - name: end-to-end tests
        run: make e2e
      - name: stack logs
        if: failure()
        run: |
          docker compose -f test/e2e/compose.yaml ps -a
          docker compose -f test/e2e/compose.yaml logs --no-color --tail 400
      - name: stop the stack
        if: always()
        run: make e2e-down

  # The stack people install (deploy/compose/compose.yaml), started the way
  # docs/deploy/docker.md says: the file alone in an empty directory, the
  # secrets from the guide's own commands, `docker compose up`, then one
  # sandbox created, used and deleted with the CLI in the server image
  # (test/compose/check.sh). Once with the server image built from this
  # commit, and once with the published image the file names, which is what a
  # user gets. The second is skipped with a notice while that tag does not
  # exist: a release pull request names its version before the tag is pushed.
  # Any other registry error fails it.
  compose:
    name: docker host stack (${{ matrix.image }} image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [built, published]
    steps:
      - uses: actions/checkout@v4
      - name: docker and compose versions
        run: |
          docker version --format 'engine {{.Server.Version}}'
          docker compose version
      - name: start it with the server image built from this commit, and run a sandbox
        if: matrix.image == 'built'
        run: make compose-check-built
      - name: is the image the file names published?
        if: matrix.image == 'published'
        id: published
        run: |
          image=$(test/compose/check.sh --default-image)
          if out=$(docker manifest inspect "$image" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -qiE 'manifest unknown|no such manifest'; then
            echo "::notice::$image is not published, so the stack was not started with it"
          else
            # A registry error is not a missing tag: do not skip on it.
            printf '%s\n' "$out"
            exit 1
          fi
      - name: start it as downloaded, with the published image, and run a sandbox
        if: matrix.image == 'published' && steps.published.outputs.exists == 'true'
        run: make compose-check
      - name: images the stack pulled
        if: always()
        run: docker image ls

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - run: make helm-lint

  images:
    name: container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/server.Dockerfile
          push: false
      - name: build cli image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/cli.Dockerfile
          push: false
      - name: build console image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/console.Dockerfile
          push: false

  dco:
    name: dco sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c is missing a Signed-off-by line (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  release-source:
    name: main accepts releases only
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: head branch is pre-release or hotfix/*
        env:
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          case "$HEAD_REF" in
            pre-release|hotfix/*) [ "$SAME_REPO" = "true" ] && exit 0 ;;
          esac
          echo "::error::main only accepts PRs from pre-release or hotfix/* in this repository; target pre-release instead"
          exit 1

  # Approves a pull request from this repository once every job above passed,
  # so release pull requests into main meet the ruleset's one-approval rule
  # without waiting for a person. Forks are never approved. The approval comes
  # from github-actions, which never pushes, so it counts as an approval after
  # the last push; a new push dismisses it and the next green run approves
  # again. It approves what CI checked, not what a reviewer read.
  approve:
    name: approve when CI passes
    needs: [go, go-experimental, postgres, e2e, compose, sdk-typescript, console, sdk-python, helm, images, dco, release-source]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: approve the pull request at the head CI checked
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)" != "$HEAD" ]; then
            echo "the pull request moved on since this run; the next run decides"
            exit 0
          fi
          gh pr review "$PR" --repo "$REPO" --approve --body "CI passed at $HEAD."
