<text x="128" y="96" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f3f4f6" letter-spacing="-1">differently</text>
<text x="64" y="152" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#f3f4f6">Run sandboxes differently: own them.</text>
<text x="64" y="186" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#9aa3af">Open-source, self-hosted control plane · one API · your infrastructure, your rules</text>
