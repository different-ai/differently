# Production-shaped install: external PostgreSQL, tokens and the OpenSandbox
# API key from existing Secrets, three server replicas, TLS ingress through
# cert-manager, ServiceMonitor.
config:
  store:
    driver: postgres
  audit:
    recordCommands: false

postgresql:
  external:
    # kubectl create secret generic differently-database \
    #   --from-literal=database-url='postgres://differently:...@db.internal:5432/differently?sslmode=verify-full'
    existingSecret: differently-database
    existingSecretKey: database-url

auth:
  # kubectl create secret generic differently-tokens \
  #   --from-literal=bootstrap-token=dly_<id>_<secret>
  existingSecret: differently-tokens

opensandbox:
  apiURL: http://opensandbox-server.opensandbox-system.svc/v1
  trust: private
  pool:
    region: dc1
    maxConcurrency: 100
  # kubectl create secret generic opensandbox-api-key --from-literal=api-key=...
  existingSecret: opensandbox-api-key
  existingSecretKey: api-key

server:
  replicas: 3
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 1Gi}
  priorityClassName: ""

ingress:
  enabled: true
  className: nginx
  hosts:
    - differently.example.com
  tls:
    enabled: true
    certManager:
      clusterIssuer: letsencrypt-prod

networkPolicy:
  server:
    egress:
      databaseCIDRs: ["10.20.0.0/24"]

metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus

test:
  existingSecret: differently-smoke-key
  existingSecretKey: api-key
