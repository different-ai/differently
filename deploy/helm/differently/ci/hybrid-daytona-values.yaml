# Hybrid: private Firecracker pool first, Daytona as an approved overflow pool
# for the "internal" and "public" classifications only. "private-only"
# sandboxes still never leave the Firecracker pool.
config:
  store:
    driver: postgres
  policy:
    external: overflow
    externalPools: [daytona]
    strategy: private-first

postgresql:
  embedded:
    enabled: true
    persistence:
      size: 4Gi

providers:
  daytona:
    enabled: true
    pool:
      name: daytona
      region: us
      maxConcurrency: 20
      costModel:
        currency: USD
        cpuHour: 0.05
        memoryGiBHour: 0.0125
      config:
        apiURL: https://app.daytona.io/api
        class: container
        autoStopMinutes: "30"
    # kubectl create secret generic daytona-credentials --from-literal=api-key=dtn_...
    existingSecret: daytona-credentials
    existingSecretKey: api-key

test:
