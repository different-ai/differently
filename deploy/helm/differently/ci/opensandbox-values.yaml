# A private OpenSandbox server running Fast Sandbox (Firecracker microVMs),
# with its API key in an existing Secret. Sandboxes are created from a Fast
# Sandbox template; pause keeps memory, and a sandbox's idleTimeoutSeconds
# becomes OpenSandbox's native idle auto-pause with wake on access.
opensandbox:
  apiURL: http://opensandbox-server.opensandbox-system.svc/v1
  trust: private
  pool:
    name: opensandbox-microvm
    region: dc1
    maxConcurrency: 50
  runtime: fastsandbox
  isolation: microvm
  templateId: tpl-ubuntu-2404
  timeoutSeconds: 86400
  # kubectl create secret generic opensandbox-api-key -n <release namespace> \
  #   --from-literal=api-key='<the OpenSandbox server api_key>'
  existingSecret: opensandbox-api-key
  existingSecretKey: api-key
