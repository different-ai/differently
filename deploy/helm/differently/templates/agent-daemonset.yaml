{{- if .Values.agent.enabled }}
{{- $a := .Values.agent }}
{{- $imagesDir := "/var/lib/differently/images" }}
{{- $pathArgs := list "--state-dir=/var/lib/differently/agent" (printf "--images-dir=%s" $imagesDir) (printf "--kernel=%s" $a.kernelPath) (printf "--firecracker=%s" $a.firecrackerPath) }}
{{- if $a.jailer.enabled }}
{{- $pathArgs = append $pathArgs (printf "--jailer=%s" $a.jailer.path) }}
{{- end }}
{{- $securityContext := dict "runAsUser" 0 "runAsNonRoot" false "readOnlyRootFilesystem" $a.readOnlyRootFilesystem }}
{{- if $a.privileged }}
{{- $_ := set $securityContext "privileged" true }}
{{- else }}
{{- $_ := set $securityContext "privileged" false }}
{{- $_ := set $securityContext "allowPrivilegeEscalation" false }}
{{- $_ := set $securityContext "capabilities" (dict "drop" (list "ALL") "add" $a.unprivileged.capabilities) }}
{{- $_ := set $securityContext "seccompProfile" (dict "type" "RuntimeDefault") }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "differently.agentName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "differently.componentLabels" (dict "ctx" . "component" "agent") | nindent 4 }}
spec:
  revisionHistoryLimit: 5
  updateStrategy:
    {{- toYaml $a.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "differently.componentSelectorLabels" (dict "ctx" . "component" "agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "differently.componentLabels" (dict "ctx" . "component" "agent") | nindent 8 }}
        {{- with $a.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        differently.dev/pool: {{ $a.pool | quote }}
        # Explicit token values; a change restarts agents (with OnDelete, on pod deletion).
        checksum/auth: {{ toJson .Values.auth | sha256sum }}
        {{- with $a.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "differently.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $a.terminationGracePeriodSeconds }}
      hostNetwork: {{ $a.hostNetwork }}
      dnsPolicy: {{ ternary "ClusterFirstWithHostNet" "ClusterFirst" $a.hostNetwork }}
      nodeSelector:
        {{- toYaml (merge (dict "differently.dev/kvm" "true") ($a.nodeSelector | default dict)) | nindent 8 }}
      {{- with $a.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $a.guestImages.enabled $a.doctor.enabled }}
      initContainers:
        {{- if $a.guestImages.enabled }}
        # Copies vmlinux and *.ext4 into the host images directory when missing
        # or different. Files are replaced atomically (copy, then rename), so
        # running microVMs keep the inode they opened.
        - name: guest-images
          image: {{ include "differently.image" (dict "image" $a.guestImages.image "ctx" .) }}
          imagePullPolicy: {{ $a.guestImages.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              src="$SOURCE_DIR"; dst=/host/images
              mkdir -p "$dst"
              for f in "$src"/*; do
                [ -f "$f" ] || continue
                b=$(basename "$f")
                if [ -f "$dst/$b" ] && cmp -s "$f" "$dst/$b"; then
                  echo "unchanged $b"; continue
                fi
                cp "$f" "$dst/.$b.tmp" && mv "$dst/.$b.tmp" "$dst/$b"
                echo "installed $b"
              done
              ls -l "$dst"
          env:
            - name: SOURCE_DIR
              value: {{ $a.guestImages.sourceDir | quote }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER]}
          volumeMounts:
            - {name: data, mountPath: /host}
        {{- end }}
        {{- if $a.doctor.enabled }}
        # Fails (and blocks the agent) until KVM, tun, Firecracker, the kernel
        # and images check out. Read the report with:
        #   kubectl logs <pod> -c doctor
        - name: doctor
          image: {{ include "differently.image" (dict "image" $a.image "ctx" .) }}
          imagePullPolicy: {{ $a.image.pullPolicy }}
          args:
            - doctor
            {{- range $pathArgs }}
            - {{ . }}
            {{- end }}
          securityContext:
            {{- toYaml $securityContext | nindent 12 }}
          {{- if and (not $a.privileged) $a.unprivileged.deviceResources }}
          resources:
            limits:
              {{- toYaml $a.unprivileged.deviceResources | nindent 14 }}
          {{- end }}
          volumeMounts:
            - {name: dev-kvm, mountPath: /dev/kvm}
            - {name: dev-net-tun, mountPath: /dev/net/tun}
            - {name: data, mountPath: /var/lib/differently}
        {{- end }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "differently.image" (dict "image" $a.image "ctx" .) }}
          imagePullPolicy: {{ $a.image.pullPolicy }}
          args:
            - --server={{ $a.serverURL | default (include "differently.internalServerURL" .) }}
            - --pool={{ $a.pool }}
            - --listen=:{{ $a.port }}
            - --advertise-url={{ $a.advertiseURL | default (printf "http://$(POD_IP):%v" $a.port) }}
            - --node=$(NODE_NAME)
            {{- range $pathArgs }}
            - {{ . }}
            {{- end }}
            - --reserve-cpu={{ $a.reserveCPU }}
            - --reserve-memory-mib={{ $a.reserveMemoryMiB }}
            {{- with $a.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DIFFERENTLY_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "differently.tokensSecretName" . }}
                  key: {{ .Values.auth.agentTokenKey }}
            {{- with $a.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: agent
              containerPort: {{ $a.port }}
              protocol: TCP
          startupProbe:
            tcpSocket: {port: agent}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            tcpSocket: {port: agent}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket: {port: agent}
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            {{- toYaml $securityContext | nindent 12 }}
          resources:
            {{- $res := deepCopy ($a.resources | default dict) }}
            {{- if and (not $a.privileged) $a.unprivileged.deviceResources }}
            {{- $_ := set $res "limits" (merge (deepCopy ($res.limits | default dict)) $a.unprivileged.deviceResources) }}
            {{- end }}
            {{- toYaml $res | nindent 12 }}
          volumeMounts:
            - {name: dev-kvm, mountPath: /dev/kvm}
            - {name: dev-net-tun, mountPath: /dev/net/tun}
            - {name: data, mountPath: /var/lib/differently}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: dev-kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: data
          hostPath:
            path: {{ $a.hostDataPath }}
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
{{- end }}
