{{- if not .Values.auth.existingSecret }}
{{- $name := include "differently.tokensSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict }}
{{- $data := get $existing "data" | default dict }}
{{- $bootstrapKey := .Values.auth.bootstrapTokenKey }}
{{- $bootstrap := "" }}
{{- if .Values.auth.bootstrapToken }}
{{- $bootstrap = .Values.auth.bootstrapToken }}
{{- else if hasKey $data $bootstrapKey }}
{{- $bootstrap = index $data $bootstrapKey | b64dec }}
{{- else }}
{{- /* dly_<id>_<secret>: id and secret from [0-9a-z]; about 200 bits in the secret. */}}
{{- $bootstrap = printf "dly_boot%s_%s" (randAlphaNum 10 | lower) (randAlphaNum 40 | lower) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "differently.labels" . | nindent 4 }}
  annotations:
    differently.dev/description: "Bootstrap operator token. Generated once; kept across upgrades."
    {{- if .Values.auth.keepSecretOnUninstall }}
    helm.sh/resource-policy: keep
    {{- end }}
type: Opaque
data:
  {{ $bootstrapKey }}: {{ $bootstrap | b64enc | quote }}
{{- end }}
