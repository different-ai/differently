{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $egress := $np.server.egress }}
{{- $providers := include "differently.enabledProviders" . | fromJsonArray }}
{{- /* External pools declared under config.pools (for example a provider whose key is stored in Differently) reach their provider on 443 too. */}}
{{- $configExternal := list }}
{{- range .Values.config.pools }}{{ if eq (.trust | default "") "external" }}{{ $configExternal = append $configExternal .name }}{{ end }}{{ end }}
{{- $usesOpenSandbox := false }}
{{- range (include "differently.config" . | fromYaml).pools }}
{{- if eq .adapter "opensandbox" }}{{ $usesOpenSandbox = true }}{{ end }}
{{- end }}
{{- $osb := $egress.opensandbox }}
{{- $osbPeer := dict }}
{{- with $osb.namespaceSelector }}{{ $_ := set $osbPeer "namespaceSelector" . }}{{ end }}
{{- with $osb.podSelector }}{{ $_ := set $osbPeer "podSelector" . }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "differently.serverName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "differently.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "differently.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $egress.restricted }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: {{ .Values.server.containerPort }}
          protocol: TCP
      {{- with $np.server.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.metrics.port }}
    - ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
      {{- with $np.server.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- if $egress.restricted }}
  egress:
    # DNS
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- if $usesOpenSandbox }}
    # OpenSandbox lifecycle API (exec and files go through its proxy)
    - ports:
        - port: {{ $osb.port }}
          protocol: TCP
      {{- if or $osbPeer $osb.cidrs }}
      to:
        {{- if $osbPeer }}
        {{- toYaml (list $osbPeer) | nindent 8 }}
        {{- end }}
        {{- range $osb.cidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- if .Values.postgresql.embedded.enabled }}
    # Embedded PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              {{- include "differently.componentSelectorLabels" (dict "ctx" . "component" "postgresql") | nindent 14 }}
      ports:
        - {port: 5432, protocol: TCP}
    {{- else if include "differently.usesPostgres" . }}
    # External PostgreSQL
    - ports:
        - port: {{ $egress.databasePort }}
          protocol: TCP
      {{- with $egress.databaseCIDRs }}
      to:
        {{- range . }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- if or $providers $configExternal $egress.runtimeProviders }}
    # External providers ({{ range $i, $p := $providers }}{{ if $i }}, {{ end }}{{ $p.kind }}{{ end }}{{ range $i, $n := $configExternal }}{{ if or $i $providers }}, {{ end }}{{ $n }}{{ end }}{{ if $egress.runtimeProviders }}{{ if or $providers $configExternal }}, {{ end }}added at runtime{{ end }})
    - ports:
        - {port: 443, protocol: TCP}
      to:
        {{- range $egress.providerCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
    {{- end }}
    {{- with $egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- if .Values.postgresql.embedded.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "differently.postgresqlName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "differently.componentLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "differently.componentSelectorLabels" (dict "ctx" . "component" "postgresql") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "differently.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "differently.componentSelectorLabels" (dict "ctx" . "component" "migrate") | nindent 14 }}
      ports:
        - {port: 5432, protocol: TCP}
{{- end }}
{{- end }}
