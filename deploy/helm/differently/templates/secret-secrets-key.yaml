{{- if and .Values.secrets.enabled (not .Values.secrets.existingSecret) }}
{{- $name := include "differently.secretsKeySecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict }}
{{- $data := get $existing "data" | default dict }}
{{- $keyName := .Values.secrets.existingSecretKey }}
{{- /* randBytes returns base64 of 32 random bytes: the format the server expects. */}}
{{- $key := "" }}
{{- if hasKey $data $keyName }}
{{- $key = index $data $keyName | b64dec }}
{{- else }}
{{- $key = randBytes 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "differently.labels" . | nindent 4 }}
  annotations:
    differently.dev/description: "Seals provider credentials stored in Differently. Generated once; back it up."
    # Losing this key makes every stored credential unreadable, so uninstall keeps it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $keyName }}: {{ $key | b64enc | quote }}
{{- end }}
