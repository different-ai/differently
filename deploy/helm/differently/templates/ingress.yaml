{{- if .Values.ingress.enabled }}
{{- $tls := .Values.ingress.tls }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "differently.serverName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "differently.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
  {{- if or .Values.ingress.annotations $tls.certManager.clusterIssuer $tls.certManager.issuer }}
  annotations:
    {{- with $tls.certManager.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
    {{- with $tls.certManager.issuer }}
    cert-manager.io/issuer: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        {{- toYaml .Values.ingress.hosts | nindent 8 }}
      secretName: {{ $tls.secretName | default (printf "%s-tls" (include "differently.fullname" .)) }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.path }}
            pathType: {{ $.Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "differently.serverName" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
