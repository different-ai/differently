{{- if and (include "differently.usesPostgres" .) (not .Values.postgresql.embedded.enabled) .Values.postgresql.external.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "differently.databaseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "differently.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
type: Opaque
data:
  database-url: {{ .Values.postgresql.external.url | b64enc | quote }}
{{- end }}
