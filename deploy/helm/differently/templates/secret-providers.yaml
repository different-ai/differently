{{- range $p := (include "differently.enabledProviders" . | fromJsonArray) }}
{{- if and (not $p.existingSecret) $p.apiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "differently.providerSecretName" (dict "provider" $p "ctx" $) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "differently.componentLabels" (dict "ctx" $ "component" "server") | nindent 4 }}
  annotations:
    differently.dev/description: {{ printf "Credential for the external %s pool %s." $p.kind $p.pool.name | quote }}
type: Opaque
data:
  api-key: {{ $p.apiKey | b64enc | quote }}
{{- end }}
{{- end }}
