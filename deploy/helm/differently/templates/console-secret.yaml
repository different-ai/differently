{{- if and .Values.console.enabled (not .Values.console.auth.existingSecret) }}
{{- $name := include "differently.consoleAuthSecretName" . }}
{{- $key := .Values.console.auth.secretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict }}
{{- $data := get $existing "data" | default dict }}
{{- $secret := "" }}
{{- if hasKey $data $key }}
{{- $secret = index $data $key | b64dec }}
{{- else }}
{{- $secret = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "differently.componentLabels" (dict "ctx" . "component" "console") | nindent 4 }}
  annotations:
    differently.dev/description: "Signs console sessions. Generated once; kept across upgrades."
    {{- if .Values.console.auth.keepSecretOnUninstall }}
    helm.sh/resource-policy: keep
    {{- end }}
type: Opaque
data:
  {{ $key }}: {{ $secret | b64enc | quote }}
{{- end }}
