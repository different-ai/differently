{{- if and .Values.opensandbox.enabled (not .Values.opensandbox.existingSecret) .Values.opensandbox.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "differently.opensandboxSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "differently.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
  annotations:
    differently.dev/description: {{ printf "API key for the OpenSandbox pool %s." .Values.opensandbox.pool.name | quote }}
type: Opaque
data:
  api-key: {{ .Values.opensandbox.apiKey | b64enc | quote }}
{{- end }}
